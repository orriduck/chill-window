name: Forest surface 2790m material visual review

on:
  push:
    branches: ['codex/forest-surface-review']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chill-forest-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/codex/forest-surface-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Prepare cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chill-playwright" --no-package-lock --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/chill-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture exactly two strict-ready paused 2790m material comparisons
        env:
          CW_CAPTURE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/chill-forest-surface"
          npm --prefix app run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/chill-forest-surface/server.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          export PW_MODULE_PATH="$RUNNER_TEMP/chill-playwright/node_modules/playwright"
          export CW_CAPTURE_DIR="$RUNNER_TEMP/chill-forest-surface"
          timeout 600s node app/scripts/capture-forest-surface.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: forest-surface-${{ github.sha }}
          path: ${{ runner.temp }}/chill-forest-surface/
          if-no-files-found: error
          retention-days: 7
