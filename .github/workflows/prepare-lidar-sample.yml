name: Probe real Peekskill roof points
on:
  push:
    branches: ['codex/tree-asset-preparation']
    paths:
      - 'app/scripts/experiments/peekskill-lidar/**'
      - '.github/workflows/prepare-lidar-sample.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect actual source classifications and footprint coverage
        run: |
          python3 -m pip install 'laspy[lazrs]==2.6.1' numpy==2.2.3 pyproj==3.7.1 shapely==2.0.7
          python3 app/scripts/experiments/peekskill-lidar/probe.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: real-roof-probe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/scripts/experiments/peekskill-lidar/output/*.json
            app/scripts/experiments/peekskill-lidar/source-selection.json
