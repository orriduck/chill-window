name: Hudson fantasy game style visual review

on:
  push:
    branches: ['codex/hudson-game-style']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chill-hudson-game-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/codex/hudson-game-style'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Initialize diagnostic artifact
        run: |
          mkdir -p "$RUNNER_TEMP/chill-hudson-game-style"
          node -e 'const fs = require("node:fs"); const p = process.env.RUNNER_TEMP + "/chill-hudson-game-style/"; fs.writeFileSync(p + "health.json", JSON.stringify({ commit: process.env.GITHUB_SHA, runtimePassed: false, captureStatus: "not_started", visualReviewRequired: true }, null, 2)); fs.writeFileSync(p + "server.log", "Preview not started yet.\n");'
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Prepare cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chill-playwright" --no-package-lock --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/chill-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture strict-ready fantasy passenger and map views
        env:
          CW_CAPTURE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/chill-hudson-game-style"
          npm --prefix app run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/chill-hudson-game-style/server.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          export PW_MODULE_PATH="$RUNNER_TEMP/chill-playwright/node_modules/playwright"
          export CW_CAPTURE_DIR="$RUNNER_TEMP/chill-hudson-game-style"
          timeout 900s node app/scripts/capture-hudson-game-style.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hudson-game-style-${{ github.sha }}
          path: ${{ runner.temp }}/chill-hudson-game-style/
          if-no-files-found: error
          retention-days: 7
