name: Terrain overlap visual review

on:
  push:
    branches: ['codex/terrain-overlap-review']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chill-terrain-overlap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/codex/terrain-overlap-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Prepare cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chill-playwright" --no-package-lock --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/chill-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture seven strict-ready terrain comparisons
        env:
          CW_CAPTURE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/chill-terrain-overlap"
          npm --prefix app run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/chill-terrain-overlap/server.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          export PW_MODULE_PATH="$RUNNER_TEMP/chill-playwright/node_modules/playwright"
          export CW_CAPTURE_DIR="$RUNNER_TEMP/chill-terrain-overlap"
          timeout 2400s node app/scripts/capture-terrain-overlap.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: terrain-overlap-${{ github.sha }}
          path: ${{ runner.temp }}/chill-terrain-overlap/
          if-no-files-found: error
          retention-days: 7
