name: Prepare static mature canopy candidates
on:
  push:
    branches: ['codex/tree-asset-preparation']
    paths: ['app/scripts/experiments/ez-tree-static/**', '.github/workflows/prepare-eztree-sample.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rebuild pinned source presets as static GLBs
        run: bash app/scripts/experiments/ez-tree-static/rebuild-assets.sh
      - name: Verify full source geometry and texture content
        run: python3 app/scripts/experiments/ez-tree-static/verify-report.py
      - name: Prepare the same Blender 4.0.2 rendering engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender=4.0.2+dfsg-1ubuntu8 blender-data=4.0.2+dfsg-1ubuntu8 python3-pil libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0
          blender --version | head -1
      - name: Bake eight source-model views without geographic synthesis
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          bash app/scripts/experiments/ez-tree-static/rebuild-impostors.sh
          /usr/bin/python3 app/scripts/experiments/ez-tree-static/verify-impostors.py
          /usr/bin/python3 app/scripts/experiments/ez-tree-static/pack-impostors.py
      - name: Preserve upstream source and texture license notices
        run: |
          cp app/scripts/experiments/ez-tree-static/.work/upstream/LICENSE app/scripts/experiments/ez-tree-static/glb/EZ-TREE-LICENSE.txt
          cp app/scripts/experiments/ez-tree-static/.work/upstream/src/app/public/textures/LICENSE.md app/scripts/experiments/ez-tree-static/glb/SOURCE-TEXTURE-LICENSE.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: real-canopy-candidates-${{ github.sha }}
          path: |
            app/scripts/experiments/ez-tree-static/glb/**
            app/scripts/experiments/ez-tree-static/report.json
            app/scripts/experiments/ez-tree-static/impostors/**
          if-no-files-found: warn
          retention-days: 7
