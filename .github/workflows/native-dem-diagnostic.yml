name: Native DEM diagnostic

on:
  push:
    branches: ['codex/native-dem-diagnostic']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chill-native-dem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/native-dem-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install source sampling dependencies (no app build or browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-numpy python3-pyproj python3-pil python3-matplotlib
          npm --prefix app ci
      - name: Sample checked-out runtime methods and actual indexed mesh
        run: |
          mkdir -p "$RUNNER_TEMP/native-dem/outputs" "$RUNNER_TEMP/native-dem/scratch"
          node app/scripts/experiments/hudson-native-dem/sample-runtime.mjs --out "$RUNNER_TEMP/native-dem/outputs/runtime.json"
      - name: Check native source, crop exact pixels and collect diagnostics
        run: |
          /usr/bin/python3 app/scripts/experiments/hudson-native-dem/diagnose.py --runtime "$RUNNER_TEMP/native-dem/outputs/runtime.json" --out "$RUNNER_TEMP/native-dem/outputs" --scratch "$RUNNER_TEMP/native-dem/scratch"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-dem-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-dem/outputs/*.png
            ${{ runner.temp }}/native-dem/outputs/*.csv
            ${{ runner.temp }}/native-dem/outputs/*.json
            ${{ runner.temp }}/native-dem/outputs/*.xml
            ${{ runner.temp }}/native-dem/outputs/*.md
          if-no-files-found: error
          retention-days: 7
